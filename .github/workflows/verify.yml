name: Verify
'on':
  workflow_dispatch:
    inputs:
      run_id:
        description: Run containing the package artifact
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
    - name: Checkout workflow
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: builder
        persist-credentials: false
    - name: Download package
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: package-android
        path: download
        run-id: ${{ inputs.run_id }}
        github-token: ${{ github.token }}
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - name: Check signature
      working-directory: builder
      shell: node scripts/private-run.mjs {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      run: python scripts/verify-signing.py --artifacts ../download
    - name: Upload verification result
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: verification
        path: builder/signing-report.json
        if-no-files-found: error
    - name: Upload encrypted diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: encrypted-diagnostics-verification
        path: ${{ runner.temp }}/build-logs/*.enc
        if-no-files-found: ignore
        retention-days: 7
