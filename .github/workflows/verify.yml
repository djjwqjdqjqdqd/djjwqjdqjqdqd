name: Verify
'on':
  workflow_dispatch:
    inputs:
      run_id:
        description: Run containing the package artifact
        required: true
        type: string
  workflow_run:
    workflows:
    - Package
    types:
    - completed
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion
      == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
    - name: Checkout workflow
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: builder
        persist-credentials: false
    - name: Find package
      id: package
      working-directory: builder
      shell: bash
      env:
        SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        GH_TOKEN: ${{ github.token }}
      run: node scripts/find-artifact.mjs
    - name: Download package
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: package-android
        path: download
        run-id: ${{ steps.package.outputs.run_id }}
        github-token: ${{ github.token }}
      if: steps.package.outputs.available == 'true'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
      if: steps.package.outputs.available == 'true'
    - name: Check signature
      working-directory: builder
      shell: node scripts/private-run.mjs {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      run: python scripts/verify-signing.py --artifacts ../download
      if: steps.package.outputs.available == 'true'
    - name: Upload verification result
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: verification
        path: builder/signing-report.json
        if-no-files-found: error
      if: steps.package.outputs.available == 'true'
    - name: Upload encrypted diagnostics
      if: always() && steps.package.outputs.available == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: encrypted-diagnostics-verification
        path: ${{ runner.temp }}/build-logs/*.enc
        if-no-files-found: ignore
        retention-days: 7
