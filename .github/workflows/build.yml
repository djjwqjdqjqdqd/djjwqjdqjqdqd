name: Build TutuCloud from private source
'on':
  workflow_dispatch:
    inputs:
      target:
        description: Platform to package
        type: choice
        default: windows
        options:
        - windows
        - android
        - macos
        - linux
        - ios
        - all
      source_ref:
        description: Private source branch, tag, or commit
        type: string
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: tutu-package-${{ inputs.target }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: 3.32.0
  GO_VERSION: 1.22.8
  FASTFORGE_REF: ce39d1da1cdde1bd532766bee5f679749f2f9024
jobs:
  build-android:
    if: inputs.target == 'all' || inputs.target == 'android'
    name: Android (universal fat APK, mobile)
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout public packaging scripts
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: builder
        persist-credentials: false
    - name: Checkout private client source (read-only)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        ref: ${{ inputs.source_ref }}
        ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
        persist-credentials: false
        fetch-depth: 1
        submodules: false
        path: source
    - name: Free disk space
      run: |
        set -x
        # 下一步会用 sdkmanager 装 ndk;28.0.13004108，预装的其他 NDK 版本用不到
        sudo rm -rf "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* || true
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true
        sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc || true
        sudo rm -rf /usr/local/share/boost /usr/local/lib/node_modules || true
        sudo apt-get clean || true
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false
    - name: Android command-line tools + SDK
      run: |
        set -e
        export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
          curl -sSfL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline.zip
          rm -rf /tmp/cmdline
          mkdir -p /tmp/cmdline
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
        fi
        export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
        yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108" "cmdline-tools;latest" || true
        echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: false
    - name: Android licenses
      run: |
        export PATH="$PATH:$HOME/Android/Sdk/cmdline-tools/latest/bin"
        export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        yes | flutter doctor --android-licenses || true
        flutter doctor -v
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - name: Restore Android signing
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
      run: |
        set -e
        if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
          echo "Android signing secrets are not fully configured, skipping release signing restore."
          exit 0
        fi
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
        touch android/local.properties
        if grep -q '^storePassword=' android/local.properties; then
          sed -i "s#^storePassword=.*#storePassword=$ANDROID_STORE_PASSWORD#" android/local.properties
        else
          echo "storePassword=$ANDROID_STORE_PASSWORD" >> android/local.properties
        fi
        if grep -q '^keyAlias=' android/local.properties; then
          sed -i "s#^keyAlias=.*#keyAlias=$ANDROID_KEY_ALIAS#" android/local.properties
        else
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/local.properties
        fi
        if grep -q '^keyPassword=' android/local.properties; then
          sed -i "s#^keyPassword=.*#keyPassword=$ANDROID_KEY_PASSWORD#" android/local.properties
        else
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/local.properties
        fi
      shell: node "../builder/scripts/private-run.mjs" {0}
    - name: Build
      env:
        ANDROID_UNIVERSAL_APK: '1'
        APP_ENV: stable
        XOR_KEY: ${{ secrets.XOR_KEY }}
        OSS_URL_1: ${{ secrets.OSS_URL_1 }}
        OSS_URL_2: ${{ secrets.OSS_URL_2 }}
        OSS_URL_3: ${{ secrets.OSS_URL_3 }}
        OSS_URL_4: ${{ secrets.OSS_URL_4 }}
        OSS_URL_5: ${{ secrets.OSS_URL_5 }}
        PANEL_TYPE: ${{ secrets.PANEL_TYPE }}
        API_PREFIX: ${{ secrets.API_PREFIX }}
        APP_NAME: ${{ secrets.APP_NAME }}
        APP_NAME_EN: ${{ secrets.APP_NAME_EN }}
        PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
      run: |
        export PATH="$PATH:$HOME/Android/Sdk/cmdline-tools/latest/bin"
        export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        echo "Using ANDROID_NDK=$ANDROID_NDK"
        dart --version
        flutter --version
        flutter pub get
        dart run setup.dart android --out app
      shell: node "../builder/scripts/private-run.mjs" {0}
    - name: Collect final packages only
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
      run: python ../builder/scripts/collect-artifacts.py --source . --out ../release-artifacts/android --platform android
    - name: Upload client packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: tutu-android
        path: release-artifacts/android/*
        if-no-files-found: error
        retention-days: 14
    - name: Upload encrypted build diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: encrypted-diagnostics-android
        path: ${{ runner.temp }}/tutu-build-logs/*.enc
        if-no-files-found: ignore
        retention-days: 7
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source
  build-ios:
    if: inputs.target == 'all' || inputs.target == 'ios'
    name: iOS (unsigned device + simulator)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
    - name: Checkout public packaging scripts
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: builder
        persist-credentials: false
    - name: Checkout private client source (read-only)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        ref: ${{ inputs.source_ref }}
        ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
        persist-credentials: false
        fetch-depth: 1
        submodules: false
        path: source
    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: false
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: 1.25.x
        cache: false
    - name: Install Flutter dependencies
      run: flutter pub get
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - name: Install Xcode project helper
      run: gem install xcodeproj --no-document
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - name: Configure iOS project
      run: ruby scripts/setup_ios.rb com.tutucloud.tutu group.com.tutucloud.tutu
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - name: Build Clash iOS framework
      run: |
        chmod +x ios/build_libclash.sh
        ios/build_libclash.sh
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - name: Install CocoaPods dependencies
      working-directory: source/ios
      run: pod install
      shell: node "../../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - name: Build unsigned iOS device target
      run: xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
        CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - name: Build unsigned iOS simulator target
      run: xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -sdk iphonesimulator -destination
        'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - name: Collect final packages only
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
      run: python ../builder/scripts/collect-artifacts.py --source . --out ../release-artifacts/ios --platform ios
    - name: Upload client packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: tutu-ios
        path: release-artifacts/ios/*
        if-no-files-found: error
        retention-days: 14
    - name: Upload encrypted build diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: encrypted-diagnostics-ios
        path: ${{ runner.temp }}/tutu-build-logs/*.enc
        if-no-files-found: ignore
        retention-days: 7
    defaults:
      run:
        working-directory: source
  build-macos:
    if: inputs.target == 'all' || inputs.target == 'macos'
    name: macOS (universal lipo + DMG)
    runs-on: macos-14
    steps:
    - name: Checkout public packaging scripts
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: builder
        persist-credentials: false
    - name: Checkout private client source (read-only)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        ref: ${{ inputs.source_ref }}
        ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
        persist-credentials: false
        fetch-depth: 1
        submodules: false
        path: source
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: false
    - name: appdmg
      run: npm install -g appdmg
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - name: Vendoring flutter_distributor (required by setup.dart)
      run: |
        rm -rf plugins/flutter_distributor
        git init plugins/flutter_distributor
        git -C plugins/flutter_distributor remote add origin https://github.com/fastforgedev/fastforge.git
        git -C plugins/flutter_distributor fetch --depth 1 origin "$FASTFORGE_REF"
        git -C plugins/flutter_distributor checkout --detach FETCH_HEAD
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - name: Build
      env:
        APP_ENV: stable
        XOR_KEY: ${{ secrets.XOR_KEY }}
        OSS_URL_1: ${{ secrets.OSS_URL_1 }}
        OSS_URL_2: ${{ secrets.OSS_URL_2 }}
        OSS_URL_3: ${{ secrets.OSS_URL_3 }}
        OSS_URL_4: ${{ secrets.OSS_URL_4 }}
        OSS_URL_5: ${{ secrets.OSS_URL_5 }}
        PANEL_TYPE: ${{ secrets.PANEL_TYPE }}
        API_PREFIX: ${{ secrets.API_PREFIX }}
        APP_NAME: ${{ secrets.APP_NAME }}
        APP_NAME_EN: ${{ secrets.APP_NAME_EN }}
        PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
      run: |
        export PATH="/opt/homebrew/bin:$PATH"
        flutter pub get
        dart run setup.dart macos --arch universal --out app --env stable
      shell: node "../builder/scripts/private-run.mjs" {0}
    - name: Collect final packages only
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
      run: python ../builder/scripts/collect-artifacts.py --source . --out ../release-artifacts/macos --platform macos
    - name: Upload client packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: tutu-macos
        path: release-artifacts/macos/*
        if-no-files-found: error
        retention-days: 14
    - name: Upload encrypted build diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: encrypted-diagnostics-macos
        path: ${{ runner.temp }}/tutu-build-logs/*.enc
        if-no-files-found: ignore
        retention-days: 7
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source
  build-linux:
    if: inputs.target == 'all' || inputs.target == 'linux'
    name: Linux (amd64)
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout public packaging scripts
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: builder
        persist-credentials: false
    - name: Checkout private client source (read-only)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        ref: ${{ inputs.source_ref }}
        ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
        persist-credentials: false
        fetch-depth: 1
        submodules: false
        path: source
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: false
    - name: Linux deps
      run: |
        sudo apt-get update -y
        sudo apt-get install -y ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev libsecret-1-dev libayatana-appindicator3-dev libkeybinder-3.0-dev libfuse2 rpm patchelf
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - name: Vendoring flutter_distributor
      run: |
        rm -rf plugins/flutter_distributor
        git init plugins/flutter_distributor
        git -C plugins/flutter_distributor remote add origin https://github.com/fastforgedev/fastforge.git
        git -C plugins/flutter_distributor fetch --depth 1 origin "$FASTFORGE_REF"
        git -C plugins/flutter_distributor checkout --detach FETCH_HEAD
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - name: Build
      env:
        APP_ENV: stable
        XOR_KEY: ${{ secrets.XOR_KEY }}
        OSS_URL_1: ${{ secrets.OSS_URL_1 }}
        OSS_URL_2: ${{ secrets.OSS_URL_2 }}
        OSS_URL_3: ${{ secrets.OSS_URL_3 }}
        OSS_URL_4: ${{ secrets.OSS_URL_4 }}
        OSS_URL_5: ${{ secrets.OSS_URL_5 }}
        PANEL_TYPE: ${{ secrets.PANEL_TYPE }}
        API_PREFIX: ${{ secrets.API_PREFIX }}
        APP_NAME: ${{ secrets.APP_NAME }}
        APP_NAME_EN: ${{ secrets.APP_NAME_EN }}
        PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
      run: |
        sudo apt-get install -y libfuse2
        flutter pub get
        dart run setup.dart linux --arch amd64 --out app --env stable
      shell: node "../builder/scripts/private-run.mjs" {0}
    - name: Collect final packages only
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
      run: python ../builder/scripts/collect-artifacts.py --source . --out ../release-artifacts/linux --platform linux
    - name: Upload client packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: tutu-linux
        path: release-artifacts/linux/*
        if-no-files-found: error
        retention-days: 14
    - name: Upload encrypted build diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: encrypted-diagnostics-linux
        path: ${{ runner.temp }}/tutu-build-logs/*.enc
        if-no-files-found: ignore
        retention-days: 7
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source
  build-windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
    - name: Checkout public packaging scripts
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: builder
        persist-credentials: false
    - name: Checkout private client source (read-only)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        ref: ${{ inputs.source_ref }}
        ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
        persist-credentials: false
        fetch-depth: 1
        submodules: false
        path: source
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
    - uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: false
    - name: Vendoring flutter_distributor
      shell: node "../builder/scripts/private-run.mjs" {0}
      run: |
        $sourceRoot = (Get-Location).ProviderPath
        $distributorPath = [IO.Path]::GetFullPath((Join-Path $sourceRoot 'plugins\flutter_distributor'))
        if (-not $distributorPath.StartsWith($sourceRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'Distributor path is outside the source workspace' }
        if (Test-Path -LiteralPath $distributorPath) { Remove-Item -LiteralPath $distributorPath -Recurse -Force }
        git init plugins\flutter_distributor
        git -C plugins\flutter_distributor remote add origin https://github.com/fastforgedev/fastforge.git
        git -C plugins\flutter_distributor fetch --depth 1 origin $env:FASTFORGE_REF
        git -C plugins\flutter_distributor checkout --detach FETCH_HEAD
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - name: Build
      env:
        APP_ENV: stable
        XOR_KEY: ${{ secrets.XOR_KEY }}
        OSS_URL_1: ${{ secrets.OSS_URL_1 }}
        OSS_URL_2: ${{ secrets.OSS_URL_2 }}
        OSS_URL_3: ${{ secrets.OSS_URL_3 }}
        OSS_URL_4: ${{ secrets.OSS_URL_4 }}
        OSS_URL_5: ${{ secrets.OSS_URL_5 }}
        PANEL_TYPE: ${{ secrets.PANEL_TYPE }}
        API_PREFIX: ${{ secrets.API_PREFIX }}
        APP_NAME: ${{ secrets.APP_NAME }}
        APP_NAME_EN: ${{ secrets.APP_NAME_EN }}
        PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
      shell: node "../builder/scripts/private-run.mjs" {0}
      run: |
        flutter pub get
        flutter doctor
        dart run setup.dart windows --arch amd64 --out app --env stable
    - name: Verify Windows software renderer before publication
      shell: node "../builder/scripts/private-run.mjs" {0}
      run: |
        python scripts/test_windows_renderer_verification.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python scripts/verify_windows_renderer.py --dist dist
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
    - name: Collect final packages only
      shell: node "../builder/scripts/private-run.mjs" {0}
      env:
        BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
      run: python ../builder/scripts/collect-artifacts.py --source . --out ../release-artifacts/windows --platform windows
    - name: Upload client packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: tutu-windows
        path: release-artifacts/windows/*
        if-no-files-found: error
        retention-days: 14
    - name: Upload encrypted build diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: encrypted-diagnostics-windows
        path: ${{ runner.temp }}/tutu-build-logs/*.enc
        if-no-files-found: ignore
        retention-days: 7
    if: inputs.target == 'all' || inputs.target == 'windows'
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source
